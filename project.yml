name: EatsClone
options:
  bundleIdPrefix: com.cognisim
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Eats
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  EatsClone:
    type: application
    platform: iOS
    info:
      path: build/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.cognisim.eatsclone.revyl
            CFBundleURLSchemes: [eatsclone]
    sources:
      - path: EatsClone
        excludes:
          - Tests
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cognisim.eatsclone
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  EatsCloneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EatsClone/Tests
    dependencies:
      - target: EatsClone
schemes:
  EatsClone:
    build:
      targets:
        EatsClone: all
        EatsCloneTests: [test]
    test:
      targets: [EatsCloneTests]
