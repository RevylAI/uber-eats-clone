project:
  id: a882d616-7092-471d-a524-0019bb41385e
session:
  idle_timeout_seconds: 1800
  before_script:
    script_path: ./scripts/prepare-revyl-session.py
    timeout_seconds: 30
  auth_bypass:
    launch_vars: [EATSCLONE_AUTH_BYPASS_ENABLED, EATSCLONE_AUTH_BYPASS_TOKEN]
    deep_link: "eatsclone://revyl-auth?token=${EATSCLONE_AUTH_BYPASS_TOKEN}&role=buyer&redirect=/home"
build:
  framework: ios
  profiles:
    pull-request:
      ios:
        app_id: ecced7bf-9a43-4a8b-9a26-c072fa7bad74
        build_commands:
          - bash scripts/build-ios.sh
        output_path: build/Build/Products/Debug-iphonesimulator/EatsClone.app
        timeout_seconds: 1800
pr_review:
  enabled: true
  review_triggers:
    paths:
      - EatsClone/**
      - Resources/**
      - scripts/**
      - project.yml
      - Package.swift
      - .revyl/**
      - .github/workflows/ios.yml
      - .github/workflows/revyl.yml
    drafts: false
  build:
    kind: revyl
    profile: pull-request
  proof_of_changes:
    enabled: true
    harness:
      kind: revyl
    system_prompt: |-
      This repository chooses its own test state. scripts/revyl-test-state.py is the test-state provider: it lists the settable client flags, backend flags and user states, and creates a test user in the state you pick. Before you start any device:
      1. Run `python3 scripts/revyl-test-state.py describe` and read every flag and state it lists.
      2. From the diff and the pull request description, pick the user state, backend flags and client flags that make the changed behaviour visible. Say which you picked and why in one sentence.
      3. Run `python3 scripts/revyl-test-state.py finalize --state <state> --flag <backend_flag>=<value>` with one --flag per backend flag you set. It prints JSON with `app_link` and `launch_env`.
      4. Start the device on the preview build Revyl names below with `revyl device start --platform ios --build-version-id <build id> --app-link '<app_link>' --launch-env '<entry>'`, repeating --launch-env for every `launch_env` entry and for each client flag as NAME=value, and add --json. This replaces the repository's default sign-in for this session.
      The app link and launch_env carry a short-lived session token. Never quote them, the token, or the finalize output in your write-up, annotations or comment; name only the state and flags you chose.
      To show a second state, for example that the change stays hidden for other users, stop the first device, run finalize again and start a new device.
    always_verify:
      - "Scope this proof to the Eats application selected by this project's pull-request profile. Verify all applicable Eats changes and the regression checks below, and report any observed Eats defect. Rides has its own project root, build, session, and proof at apps/rides/.revyl/config.yaml. Do not require Rides screens, its driver role, or its service inside the Eats binary; those belong to the separate Rides proof, not an unmet Eats verification requirement."
      - The fresh session bypasses onboarding and shows the Home tab with the Revyl sign-in accepted banner.
      - Add a meal, customize it, open the cart, and place a demo order without real authentication, network services, or payment.
      - The Home, Browse, Orders, and Account tabs remain reachable when the cart contains items.
  strict_ci_check:
    build: true
