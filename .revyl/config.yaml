project:
  id: a882d616-7092-471d-a524-0019bb41385e
session:
  idle_timeout_seconds: 1800
  before_script:
    script_path: ./scripts/prepare-revyl-session.py
    timeout_seconds: 30
  auth_bypass:
    launch_vars: [EATSCLONE_AUTH_BYPASS_ENABLED, EATSCLONE_AUTH_BYPASS_TOKEN]
    deep_link: "eatsclone://revyl-auth?token=${EATSCLONE_AUTH_BYPASS_TOKEN}&role=buyer&redirect=/home"
build:
  framework: ios
  profiles:
    pull-request:
      ios:
        app_id: ecced7bf-9a43-4a8b-9a26-c072fa7bad74
        build_commands:
          - bash scripts/build-ios.sh
        output_path: build/Build/Products/Debug-iphonesimulator/EatsClone.app
        timeout_seconds: 1800
pr_review:
  enabled: true
  review_triggers:
    paths:
      - EatsClone/**
      - Resources/**
      - scripts/**
      - project.yml
      - Package.swift
      - .revyl/**
      - .github/workflows/ios.yml
      - .github/workflows/revyl.yml
    drafts: false
  build:
    kind: revyl
    profile: pull-request
  proof_of_changes:
    enabled: true
    harness:
      kind: revyl
    system_prompt: |-
      This repository chooses its own test state, and the sign-in token never passes through you. Before you start any device:
      1. Run `python3 scripts/revyl-test-state.py describe` and read every user state, backend flag and client flag it lists. Ignore its finalize command.
      2. From the diff and the pull request description, pick the user state, backend flags and client flags that make the changed behaviour visible. Say which you picked and why in one sentence.
      3. Start the device on the preview build Revyl names below, putting your choice in STATE_REQUEST on the same command line:
         STATE_REQUEST='{"state": "<user_state>", "backend_flags": {"<name>": "<value>"}, "client_flags": {"<NAME>": "<value>"}}' revyl device start --platform ios --build-version-id <build id> --json
         Do not pass --app-link or --launch-env. The repository's session.before_script reads STATE_REQUEST, creates the test user, and the configured deep link signs it in.
      4. Right after each start, print which user was created with `tail -n 1 .revyl/state-provider-audit.log | python3 -c 'import json,sys; d=json.loads(sys.stdin.read()); print(d["user_id"], d["state"], d["backend_flags"], d["client_flags"])'`. Never print the rest of that file.
      Prove the change in at least two states: one where it should appear and one where it should stay hidden. For each extra state, stop the device first, then start a new one with a new STATE_REQUEST, and confirm step 4 shows a different user_id.
    always_verify:
      - "Scope this proof to the Eats application selected by this project's pull-request profile. Verify all applicable Eats changes and the regression checks below, and report any observed Eats defect. Rides has its own project root, build, session, and proof at apps/rides/.revyl/config.yaml. Do not require Rides screens, its driver role, or its service inside the Eats binary; those belong to the separate Rides proof, not an unmet Eats verification requirement."
      - The fresh session bypasses onboarding and shows the Home tab with the Revyl sign-in accepted banner.
      - Add a meal, customize it, open the cart, and place a demo order without real authentication, network services, or payment.
      - The Home, Browse, Orders, and Account tabs remain reachable when the cart contains items.
  strict_ci_check:
    build: true
