name: Rides
on:
  push:
    branches: [main]
    paths: ['apps/rides/**', 'services/ride-demo/**', 'services/ride-convex/**', '.github/workflows/rides.yml']
  pull_request:
    paths: ['apps/rides/**', 'services/ride-demo/**', 'services/ride-convex/**', '.github/workflows/rides.yml']
jobs:
  convex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run typecheck && npm test
        working-directory: services/ride-convex
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: services/ride-demo
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-ios.sh
        working-directory: apps/rides
