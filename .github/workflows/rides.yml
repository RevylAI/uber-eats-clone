name: Rides demo
on:
  push:
    paths: ['apps/rides/**', 'services/ride-demo/**', '.github/workflows/rides.yml']
  pull_request:
    paths: ['apps/rides/**', 'services/ride-demo/**', '.github/workflows/rides.yml']
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: services/ride-demo
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-ios.sh
        working-directory: apps/rides
