name: RidesDemo
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.1
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: '-'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    'EXCLUDED_ARCHS[sdk=iphonesimulator*]': x86_64
targets:
  RidesDemo:
    type: application
    platform: iOS
    info:
      path: .generated/RidesDemo-Info.plist
      properties:
        CFBundleDisplayName: Rides
        ConvexDeploymentURL: https://harmless-mammoth-742.convex.cloud
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [eatsclone]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.revyl.ridesdemo.revyl
            CFBundleURLSchemes: [ridesdemo]
    sources:
      - App
      - Core
      - Features
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.revyl.ridesdemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Simulator.entitlements
    dependencies:
      - package: ConvexMobile
  RidesDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.revyl.ridesdemo.tests
    dependencies:
      - target: RidesDemo
schemes:
  RidesDemo:
    build:
      targets:
        RidesDemo: all
        RidesDemoTests: [test]
    test:
      targets: [RidesDemoTests]
