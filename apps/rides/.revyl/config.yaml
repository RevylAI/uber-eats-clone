project:
  id: b13e33ff-5c8d-490e-bb24-9ef1d4c06bba
session:
  idle_timeout_seconds: 1800
  before_script:
    script_path: ./scripts/prepare-revyl-session.py
    timeout_seconds: 30
  auth_bypass:
    launch_vars: [RIDES_AUTH_BYPASS_ENABLED, RIDES_AUTH_BYPASS_TOKEN]
    deep_link: "ridesdemo://revyl-auth?token=${RIDES_AUTH_BYPASS_TOKEN}&role=rider&redirect=/home"
build:
  framework: ios
  profiles:
    rides:
      ios:
        app_id: 1f375e45-bf9b-434a-b939-a8892a2297c3
        build_commands:
          - bash scripts/build-ios.sh
        output_path: build/Build/Products/Debug-iphonesimulator/RidesDemo.app
        timeout_seconds: 1800
pr_review:
  enabled: true
  review_triggers:
    paths:
      - apps/rides/**
      - services/ride-demo/**
      - services/ride-convex/**
      - docs/RIDES.md
      - docs/RIDES_VERIFICATION.md
      - .github/workflows/rides.yml
      - .github/workflows/revyl.yml
      - scripts/test_revyl_config.py
    drafts: false
  build:
    kind: revyl
    profile: rides
  proof_of_changes:
    enabled: true
    harness:
      kind: revyl
    always_verify:
      - "Scope this proof to the Rides application selected by this project's rides profile. Verify all applicable Rides changes and the checks below, and report any observed Rides defect. Eats has its own root project, build, session, and proof at .revyl/config.yaml. Do not require Eats ordering screens inside the Rides binary; they belong to the separate Eats proof, not an unmet Rides verification requirement."
      - A fresh Rides session opens the normal Rider Home signed into a newly registered Convex database account. The session hook supplies its real account session; no connection screen, invitation, role switch, or test banner should be visible. Never publish account session tokens, launch values, passwords, or credentials.
      - Open Where to, select a destination, choose a vehicle and payment preference, and confirm pickup. Verify the hosted request reaches Finding your ride; without a second online driver it must not invent an acceptance or charge. Cancel the request and verify a zero-charge Cancelled history entry. Do not enter real payment information.
      - Home, Services, Activity, and Account remain reachable after cancellation. Account must show the registered profile. Open saved places and wallet; payments, payouts, live GPS, and driver verification are unavailable and must not be reported as working integrations.
      - >-
        When the diff or PR description requests a paired rider/driver flow, provision and control two Rides phones rather than stopping at the initial rider device. From apps/rides, run python3 scripts/start-session.py sequentially for --role rider and --role driver with the same new private --accounts-file and the exact current PR preview --build-version-id. These commands register distinct real database users in one isolated service area and inject separate private sessions. Retain both returned session_id values and explicitly target each instruction, validation, and screenshot by session ID. Keep the Revyl harness and Benchmarks account; never switch to the Uber credential or an older build.
      - >-
        For a requested paired flow, take the driver online through its UI, book as the rider, accept as the driver, and verify both screens agree. Exercise the requested chat, arrival, start, completion, receipt, rating, tip preference, and cancellation checks on their respective phones. Never fabricate acceptance or substitute backend mutations for driver UI actions. If provisioning or targeting the second device fails, report the attempted operation and concrete error rather than assuming it is unsupported. Do not claim paired coverage from a single phone. Finish or cancel active rides, sign out both accounts, stop only proof-owned sessions, and delete the private pair file without exposing its contents.
  strict_ci_check:
    build: true
