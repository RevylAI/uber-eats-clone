project:
  id: b13e33ff-5c8d-490e-bb24-9ef1d4c06bba
session:
  idle_timeout_seconds: 1800
  before_script:
    script_path: ./scripts/prepare-revyl-session.py
    timeout_seconds: 30
  auth_bypass:
    launch_vars: [RIDES_AUTH_BYPASS_ENABLED, RIDES_AUTH_BYPASS_TOKEN]
    deep_link: "ridesdemo://revyl-auth?token=${RIDES_AUTH_BYPASS_TOKEN}&role=rider&redirect=/home"
build:
  framework: ios
  profiles:
    rides:
      ios:
        app_id: 1f375e45-bf9b-434a-b939-a8892a2297c3
        build_commands:
          - bash scripts/build-ios.sh
        output_path: build/Build/Products/Debug-iphonesimulator/RidesDemo.app
        timeout_seconds: 1800
pr_review:
  enabled: true
  review_triggers:
    paths:
      - apps/rides/**
      - services/ride-demo/**
      - services/ride-convex/**
      - docs/RIDES.md
      - docs/RIDES_VERIFICATION.md
      - .github/workflows/rides.yml
      - .github/workflows/revyl.yml
      - scripts/test_revyl_config.py
    drafts: false
  build:
    kind: revyl
    profile: rides
  proof_of_changes:
    enabled: true
    harness:
      kind: revyl
    always_verify:
      - "Scope this proof to the Rides application selected by this project's rides profile. Verify all applicable Rides changes and the checks below, and report any observed Rides defect. Eats has its own root project, build, session, and proof at .revyl/config.yaml. Do not require Eats ordering screens inside the Rides binary; they belong to the separate Eats proof, not an unmet Rides verification requirement."
      - A fresh Rides session opens Home with the Revyl sign-in accepted Rider banner, without opening Eats or asking for real authentication.
      - The hosted Convex backend is prefilled in Demo connection. Create a new private Rider room, then Continue as Rider. Keep invitations hidden and never include invitation codes, session tokens, or credentials in public evidence.
      - Open Where to, select an offline destination, choose a vehicle and demo payment label, and confirm pickup. Verify the hosted request reaches Finding your ride; without a second online driver it must not invent an acceptance or charge. Cancel the requested trip and verify a zero-charge Cancelled history entry. Do not enter real payment information.
      - Home, Services, Activity, and Account remain reachable after the cancellation. Open saved places and wallet from Account using only demo data.
      - Driver acceptance, two-way chat, arrival, start, completion, receipts, rating, and tips require a second Rides phone joined to the same private room. Do not report those paired behaviors as passed from this single-phone proof.
  strict_ci_check:
    build: true
